[project]
name = "engine-web"
version = "1.7.0"
description = "Web control interface: an assistant-ui client for chatting with engine agents."
requires-python = ">=3.11"
# Composition root: the only layer allowed to depend on concrete adapters.
# The ASGI server is the Python half of the assistant-ui application. The React
# dependencies live in this directory's package.json.
dependencies = [
    "engine-runtime",
    "engine-github-concierge",
    "engine-slack-concierge",
    # The loopback MCP transport a loop's agent reaches its tools through.
    "engine-single-tool-mcp",
    # The engine that runs the graph workflows, and the contract it
    # implements. Startup reads every file in the workflow directory and a
    # workflow file imports the binding, so it would have to be installed even
    # if this app started none of them. (The worker and control server list it
    # for that reason alone.)
    "engine-graph-runtime",
    "engine-graph-runtime-langgraph",
    # Registered graphs, loops and node steering under `/api/v1`, for the
    # `engine graph|loop|node` commands.
    "engine-graph-service",
    # One adapter per capability, named <capability>-<vendor>: what is needed
    # first, who provides it second. SQLite gives chat durable conversations
    # without requiring an external database service.
    # Two agents behind one capability: the chat page offers a choice between
    # them, and the composition root is the only thing that knows their names.
    "engine-adapter-agent-runner-acp",
    "engine-adapter-sandbox-process",
    "engine-adapter-communications-buzz",
    "engine-adapter-communications-slack",
    "engine-adapter-source-control-github",
    "engine-adapter-source-control-gitlab",
    "engine-adapter-state-store-sqlite",
    "engine-adapter-workflow-runtime-temporal",
    "engine-adapter-workspace-provider-git-worktree",
    "starlette>=0.52",
    "uvicorn>=0.35",
    "keyring>=25",
    "filelock>=3.18",
    "platformdirs>=4",
    "python-dotenv>=1.0",
]

[project.scripts]
engine-web = "engine.apps.web.__main__:main"
# The source checkout's edit-reload loop. A developer convenience rather than a
# capability, so it ships from the app it reloads instead of from a package of
# its own.
engine-dev = "engine.apps.web.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.uv.sources]
engine-adapter-sandbox-process = { workspace = true }
engine-runtime = { workspace = true }
engine-github-concierge = { workspace = true }
engine-slack-concierge = { workspace = true }
engine-single-tool-mcp = { workspace = true }
engine-graph-runtime = { workspace = true }
engine-graph-runtime-langgraph = { workspace = true }
engine-graph-service = { workspace = true }
engine-adapter-agent-runner-acp = { workspace = true }
engine-adapter-communications-buzz = { workspace = true }
engine-adapter-communications-slack = { workspace = true }
engine-adapter-source-control-github = { workspace = true }
engine-adapter-source-control-gitlab = { workspace = true }
engine-adapter-state-store-sqlite = { workspace = true }
engine-adapter-workflow-runtime-temporal = { workspace = true }
engine-adapter-workspace-provider-git-worktree = { workspace = true }
