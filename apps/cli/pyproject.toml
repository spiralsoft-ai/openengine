[project]
name = "engine-cli"
version = "1.7.0"
description = "Terminal control surface for a local or remote OpenEngine service."
requires-python = ">=3.11"
dependencies = ["engine-runtime", "engine-graph-cli", "platformdirs>=4"]

[project.scripts]
engine = "engine.apps.cli.__main__:main"
oe = "engine.apps.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
engine-graph-cli = { workspace = true }
