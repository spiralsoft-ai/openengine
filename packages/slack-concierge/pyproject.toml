[project]
name = "engine-slack-concierge"
version = "1.7.0"
description = "Slack conversation graph and explicit ingress and egress boundaries."
requires-python = ">=3.11"
dependencies = ["engine-domain", "engine-single-tool-mcp", "langgraph-acp", "langgraph>=1.0", "starlette>=0.52"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-single-tool-mcp = { workspace = true }
langgraph-acp = { path = "../../langgraph-acp", editable = true }
