[project]
name = "engine-single-tool-mcp"
version = "1.7.0"
description = "Transport for exposing one validated host callback over stdio MCP."
requires-python = ">=3.11"
# Nothing. The transport carries whatever a surface's tool returns without
# looking at it, so it needs no vocabulary of its own -- not even the domain's.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
