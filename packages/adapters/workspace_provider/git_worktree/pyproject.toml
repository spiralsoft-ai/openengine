[project]
name = "engine-adapter-workspace-provider-git-worktree"
version = "1.7.0"
description = "Workspace Provider capability backed by local git worktrees."
requires-python = ">=3.11"
# Depends on the runtime (and through it ports + domain). Worktree management
# shells out to Git and needs no third-party Python dependency.
dependencies = ["engine-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
