[project]
name = "engine-adapter-state-store-sqlite"
version = "1.7.0"
description = "State Store capability backed by SQLite."
requires-python = ">=3.11"
# SQLite ships with Python. Alembic and SQLAlchemy manage its schema at startup.
dependencies = ["engine-migrations", "engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-migrations = { workspace = true }
engine-ports = { workspace = true }
