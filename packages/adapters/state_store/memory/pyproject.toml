[project]
name = "engine-adapter-state-store-memory"
version = "1.7.0"
description = "State Store capability, in process. Real behaviour, no durability."
requires-python = ">=3.11"
# Imports `engine.ports` and `engine.domain` only -- it implements a port, it
# does not dispatch commands, so it has no use for the runtime.
dependencies = ["engine-ports"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-ports = { workspace = true }
