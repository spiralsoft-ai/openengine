[project]
name = "engine-adapter-agent-runner-acp"
version = "1.7.0"
description = "Agent Runner capability backed by ACP agents, reached through langgraph-acp."
requires-python = ">=3.11"
# The protocol is langgraph-acp's: this package only binds its providers to the
# runner port.
dependencies = ["engine-runtime", "langgraph-acp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
langgraph-acp = { path = "../../../../langgraph-acp", editable = true }
