[project]
name = "engine-adapter-communications-slack"
version = "1.7.0"
description = "Communications capability backed by Slack."
requires-python = ">=3.11"
dependencies = ["engine-runtime", "httpx>=0.28", "keyring>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
