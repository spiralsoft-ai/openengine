[project]
name = "engine-adapter-source-control-github"
version = "1.7.0"
description = "Source Control capability backed by GitHub."
requires-python = ">=3.11"
# Depends on the runtime (and through it ports + domain). Infrastructure SDKs
# get added here when the capability is actually implemented -- Ticket 1 ships
# placeholders only, so this package still installs with no third-party deps.
dependencies = ["engine-runtime", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
