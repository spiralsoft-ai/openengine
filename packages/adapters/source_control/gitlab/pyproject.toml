[project]
name = "engine-adapter-source-control-gitlab"
version = "1.7.0"
description = "Source Control capability backed by GitLab."
requires-python = ">=3.11"
dependencies = ["engine-runtime", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-runtime = { workspace = true }
