[project]
name = "engine-runtime"
version = "1.7.0"
description = "Dispatches engine commands to capability implementations."
requires-python = ">=3.11"
# `engine-graph-runtime` is the contract, not an engine. The loader only needs
# to recognise a graph workflow, which is two attributes.
dependencies = ["engine-domain", "engine-ports", "engine-graph-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-ports = { workspace = true }
engine-graph-runtime = { workspace = true }
