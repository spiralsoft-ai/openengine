[project]
name = "engine-scoper"
version = "1.7.0"
description = "Determines which work orders should exist for desired project state."
requires-python = ">=3.11"
dependencies = ["engine-domain", "langgraph-acp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
langgraph-acp = { path = "../../langgraph-acp", editable = true }
