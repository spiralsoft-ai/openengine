[project]
name = "engine-ports"
version = "1.7.0"
description = "Capability interfaces the engine's commands are dispatched through."
requires-python = ">=3.11"
dependencies = ["engine-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
