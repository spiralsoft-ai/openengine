[project]
name = "engine-graph-runtime-langgraph"
version = "1.7.0"
description = "The GraphRuntime contract, implemented against LangGraph and langgraph-acp."
requires-python = ">=3.11"
dependencies = [
    "engine-domain",
    "engine-migrations",
    "engine-graph-runtime",
    # The capability a workspace component provisions through. The port, not an
    # adapter: which checkout a deployment gets is its own business, and naming
    # git here would put an implementation in a package that runs graphs.
    "engine-ports",
    # Reuses the step runtime's broker, including its schemas and security rules.
    "engine-runtime",
    "langgraph>=1.0",
    "langgraph-acp",
    "langgraph-checkpoint>=2.0",
    # What `workflows.sqlite_runtime` opens. A deployment needs a durable
    # checkpointer to have history, resumption or a run that survives a restart,
    # so the binding ships the one rather than leaving each to wire its own.
    "langgraph-checkpoint-sqlite>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-migrations = { workspace = true }
engine-domain = { workspace = true }
engine-graph-runtime = { workspace = true }
engine-runtime = { workspace = true }
engine-ports = { workspace = true }
langgraph-acp = { path = "../../langgraph-acp", editable = true }
