[project]
name = "engine-migrations"
version = "1.7.0"
description = "Alembic migration histories for OpenEngine state stores."
requires-python = ">=3.11"
dependencies = ["alembic>=1.16", "sqlalchemy>=2.0"]

[project.scripts]
engine-migrate = "migrations.migration:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migrations"]

[tool.uv.workspace]
# Adapters are grouped by the capability they implement, so a distribution sits
# two levels down: packages/adapters/<capability>/<vendor>.
members = ["packages/*", "packages/adapters/*/*", "apps/*", "cli/client", "cli/service"]
# `packages/adapters` is a grouping directory, not a distribution. The
# capability directories under it are the same, and `packages/*` does not reach
# them. Open Verify is an independent distribution for later repository extraction.
exclude = ["packages/adapters", "packages/engine", "apps/open-verify"]

[dependency-groups]
# `watchfiles` is what `engine-dev` reloads on: Uvicorn falls back to polling
# every watched file without it, which is slower and misses nothing only
# because it looks at everything. A development dependency rather than one of
# `engine-web`'s, because a served interface never reloads.
dev = [
    "httpx>=0.28",
    # The durable checkpointer the graph-runtime tests use. A test that
    # destroys a runtime and rebuilds it from a file proves something an
    # in-memory saver shared between the two would not.
    "langgraph-checkpoint-sqlite>=2.0",
    "pyright==1.1.408",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff==0.16.10",
    "watchfiles>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect the shared forge contract alongside the default test filename patterns.
python_files = ["test_*.py", "*_test.py", "source_control_git.py"]
# Live provider runs are deselected by default and opted into with
# `-m compatibility`, which is what the scheduled ACP compatibility workflow
# does. They need a real agent, real credentials, and somebody else's uptime, so
# having them in the default run would make `pytest` mean "did we break
# something, or is OpenAI having a bad ten minutes?".
addopts = "-q -m 'not compatibility'"
markers = [
    "compatibility: drives a real provider agent; scheduled rather than per-PR",
    "integration: boots a real local dependency and exercises its public interface",
]

[tool.coverage.run]
source = ["apps", "cli", "packages", "migrations", "workflows"]

[tool.coverage.report]
# Discover unexecuted files across the engine namespace packages as well.
include_namespace_packages = true
include = ["*/src/engine/*", "migrations/*", "workflows/*"]
precision = 2
# Initial full-suite line coverage is 85.12%; allow a small platform/version margin.
fail_under = 84

[tool.ruff]
target-version = "py311"
# Pin the analyzer as well as its dependency: upgrades must recheck the baseline.
required-version = "==0.16.10"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901", "PLR0912", "PLR0913", "PLR0915", "BLE001", "TRY"]

# Measured with Ruff 0.16.10; ratchet down in #779 as the owning refactors land.
[tool.ruff.lint.mccabe]
max-complexity = 534  # web.api.create_app; #748

[tool.ruff.lint.pylint]
max-branches = 35  # TerminalMcpBroker._repository_call; #755
max-args = 33  # web.api.create_app; #743
max-statements = 1459  # web.api.create_app; #748

[tool.ruff.lint.per-file-ignores]
# Existing diagnostics only: no directory globs or whole rule-family ignores.
# #779 removes each entry below. See docs/ruff-baseline.md for the ratchet policy.
