[project]
name = "engine-graph-service"
version = "1.7.0"
description = "Registered graphs, runs, loops and node steering, served by the engine daemon over langgraph-acp."
requires-python = ">=3.11"
dependencies = [
    "engine-domain",
    # The service's tables are revisions in the graph database's history.
    "engine-migrations",
    "engine-ports",
    "engine-runtime",
    "engine-graph-runtime",
    # Graphs registered here are compiled to LangGraph and their agent nodes
    # are langgraph-acp sessions, driven by the daemon's one runtime.
    "engine-graph-runtime-langgraph",
    "langgraph>=1.0",
    "langgraph-acp",
    "pyyaml>=6",
    "starlette>=0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.uv.sources]
engine-domain = { workspace = true }
engine-migrations = { workspace = true }
engine-ports = { workspace = true }
engine-runtime = { workspace = true }
engine-graph-runtime = { workspace = true }
engine-graph-runtime-langgraph = { workspace = true }
langgraph-acp = { path = "../../langgraph-acp", editable = true }
