attribution = false
default_branch = "main"
# Hide the Projects accordion; set true to show it (defaults to true if omitted).
# A deployment's public_url and GitHub login settings belong in its own config
# outside this checkout, loaded through ENGINE_CONFIG. See docs/github-login.md.

# Deployment repositories and webhook allowlists belong in the machine config:
# ~/.config/openengine/engine.toml (or $XDG_CONFIG_HOME/openengine/engine.toml).
# See docs/github-webhooks.md. This checkout does not enable repository hooks.
[github]
# Set false when reviewers prefer to resolve addressed review threads themselves.
resolve_addressed_threads = true
# Explicit aliases of the SAME forge, mapped to its transport authority (host and optional port).
# Example: { "github-web.example" = "github-api.example" }
# Aliases are accepted only by the named transport; this does not add forges.
# Explicitly include the host of OpenEngine/OpenEngine.
host_aliases = { "github.com" = "github.com" }

# GitHub user IDs that sign in without a repository check, so they can still
# get in when the server's GitHub login stops answering. See docs/github-login.md.
[access]
operators = [
  6279187,    # dethstrobe
  237151230,  # SheaHawkins
  33102427,   # vvasyuk
]

[communications]
provider = "slack"
# #openengine-bot, by id so the post skips the name lookup.
channel = "C0BUZP7GR0V"

# What pinging the bot starts. A mention is a sentence, so the answers the web
# form collects alongside the prompt come from here instead. See
# docs/work-orders-from-slack.md for the Slack app side of it.
[work_orders]
repository = "."
workflow = "implementation-review-rerank"

[orchestrator]
host = "127.0.0.1:7233"
database = ".engine/temporal.sqlite3"
health_check_interval = 5.0

[claude]
output_style = "concise"
# The Claude Code login agents use (CLAUDE_CONFIG_DIR). Defaults to ~/.claude.
# config_dir = "~/repo/work/.claude-work"

[approvals]
auto_approve = true
allow = ["read", "edit"]

[approvals.bash]
allow = [
  ".venv/bin/python -m pytest tests/**",
  "uv run pytest **",
  "mkdir **",
]

# Repository work has tools of its own -- `git_subcommand` and
# `open_pull_request`, served to the steps granted them -- and these are the
# shell spellings of the same operations. Denied rather than merely unlisted:
# an agent holding both a tool and a shell that can do the same thing will use
# whichever it thought of first, and only one of the two runs in the step's own
# workspace or refuses to publish an internal branch.
deny = [
  "git add **",
  "git commit **",
  "git branch **",
  "git checkout **",
  "git switch **",
  "git push **",
  "gh pr create **",
]

# What `engine agent claude|codex|opencode` sessions are served, as an implementation node's
# `tools`. These are the defaults.
# [sessions]
# tools = ["git_subcommand", "open_pull_request"]

[workflows]
directory = "workflows"

# Host process execution; smolvm is reserved for the VM adapter.
[sandbox]
backend = "process"
